name: Build and Deploy (Main & Dev)

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 1. Checkout and Build Main Branch
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo

      - name: Build main branch
        run: |
          cd main-repo
          npm ci
          npm run build
          mkdir -p ../dist-merged
          cp -r dist/* ../dist-merged/

      # 2. Check If Remote Dev Branch Exists
      - name: Check for dev branch
        id: check-dev
        run: |
          cd main-repo
          DEV_EXISTS=$(git ls-remote --heads origin dev)
          if [ -n "$DEV_EXISTS" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      # 3. Checkout and Build Dev Branch (if present)
      - name: Checkout dev branch
        if: steps.check-dev.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-repo

      - name: Build dev branch into /dev/
        if: steps.check-dev.outputs.found == 'true'
        run: |
          cd dev-repo
          npm ci
          npm run build
          mkdir -p ../dist-merged/dev
          cp -r dist/* ../dist-merged/dev/

      # 4. Upload and Deploy Merged Site
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-merged

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
