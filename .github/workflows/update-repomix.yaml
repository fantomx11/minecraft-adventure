name: Generate Repomix Artifact

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    env:
      SAFE_BRANCH:    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set safe branch name
        run: echo "SAFE_BRANCH=$(echo '${{ github.ref_name }}' | tr '/' '-')" >> $GITHUB_ENV

      - name: Generate Repomix output
        run: npx repomix --style xml --include "**/*.ts,**/*.tsx" --output "repomix-output-$SAFE_BRANCH.xml"

      - name: Upload Repomix artifact
        uses: actions/upload-artifact@v4
        with:
          name: repomix-output-${{ env.SAFE_BRANCH }}
          path: repomix-output-${{ env.SAFE_BRANCH }}.xml
          retention-days: 7
